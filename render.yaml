services:
  - type: web
    name: math-hint-generator
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: DAGSHUB_USERNAME
        sync: false
      - key: DAGSHUB_TOKEN
        sync: false
  